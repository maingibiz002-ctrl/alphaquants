<div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
        <h3 class="fw-bold text-white mb-0" id="pageTitle">Dashboard Overview</h3>
        <small class="text-secondary">Quant Intelligence Portfolio & Analytics Platform</small>
    </div>

    <div class="d-flex align-items-center gap-3">
        <div class="position-relative" style="min-width: 240px;">
            <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
            <input type="text" class="form-control search-input ps-5" placeholder="Search models, indicators, assets...">
        </div>
        <div class="d-flex align-items-center gap-2 glass-card px-3 py-1">
            <div class="bg-warning text-dark fw-bold rounded-circle d-flex align-items-center justify-content-center user-avatar-badge">
                {{ request.user.username|slice:":2"|upper }}
            </div>
            <span class="small text-white fw-semibold">{{ request.user.username }}</span>
        </div>
    </div>
</div>
